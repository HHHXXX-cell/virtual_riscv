# VR1 自动编排队列（run_cmd/AutoQueue.yaml）
#
# 用途：R8「项目编排 AI（PM）」的唯一状态载体。每轮会话由 R8 执行
#       `python script/gate.py check` → `dispatch` → 干活 → `report`，
#       使"下一步做什么"不再依赖人的下一条指令，也不依赖某个会话的记忆。
# 依据：doc/项目开发流程.md §12.1~12.4（人只在 P1~P4 介入）、
#       《AI进行IC开发验证工作流程》v3.0 §1.3 阶段×角色矩阵、§6.1 评审收敛判据（§6.1 系 2026-09-23 v3.0 新建；此前为悬空引用）。
# 字段约定（gate.py 逐条机判，缺项即 FAIL）：
#   id            队列号，Q-xxx，全局唯一
#   task          工作项（一句话）
#   role          归属角色：R1 架构师 / R2 参考模型 / R3 设计 / R4 平台 / R5 归因 / R6 审计 / R8 编排
#   basis         依据：文件 + 节号或台账号（不写行号，行号随编辑漂移；节号稳定可 grep）
#   done_when     可机判完成判据：必须是"某文件存在/某台账号转已解决/某脚本输出为 0"这类事实
#   state         ready | blocked | in_progress | in_review | done | fused
#   priority      P1（挡门禁）/ P2（挡主线）/ P3（可延）
#   depends_on    前置队列项（空数组表示无前置）
#   blocked_by    外部阻塞（ISS-xxx 或 Bn）；非空时 dispatch 一律跳过
#   review_rounds 该项已跑的 R7 评审轮数（§6.1 硬上限 5，达 5 即置 fused 并升级）
#   full_rounds   该项**已消耗**的终局全量复核轮数（§9.4 硬上限 5；达 5 未收敛须 fused 转 R0。
#                 人可越权继续，但须在 cap_waiver 写明谁在何时批准，否则 gate 判 FAIL）
#   cap_waiver    人批准的越权批文原文（缺省无）；有它时 review/full 两项轮次上限改打 *-waiver PASS
#   decision_rounds 该项已派给 vr1-decider 的次数（缺省 0；**达 3 次即熔断转人**，不得继续消耗轮次）
#   attempts      派发失败计数（缺省无即 0；每失败一次 +1，达 3 自动置 blocked 并写 block_reason 转人——ISS-053）
#   landable      落实证据落点（done 项必填，"已接受/同意改"不算闭环——§6.1 C1）
#
# 领队循环协议（主会话 = 领队；子代理无法互相派发，故调度只能在此侧）：
#   每轮 ① python script/gate.py check（有 FAIL 即先修，不得宣布任何"已落实"）
#        ② python script/gate.py loop   （由 loop 给出本轮唯一动作，不自行挑活）
#        ③ 执行该动作 → 回填 state/done_when/landable → 回 ①
#   停止条件（只有三种）：全部 done → 呈 R0 做阶段出口判定（不得自称"项目完成"）；
#   只剩被人工阻塞项 → escalate 后停；触熔断（评审 5 轮 / 决策 3 轮）→ 出决策包后停。
#   绝不自动越过：P1~P4 四个签署点与 §12.3 三类必报项（红线 RA1/RA3）。
#   派发失败的计数与转人（ISS-053 实装）：派发失败（空返回/超时/被拒）⇒ R8 **必须**执行
#     `python script/gate.py attempts <Q-id>` 递增 attempts；达 3 ⇒ 自动 blocked 并转人
#     （不得口头重派了事；FAIL 判据 queue-attempts-cap，对账 WARN queue-attempts-ready）。

